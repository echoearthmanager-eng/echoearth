<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EchoEarth Geo Intelligence System</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#050814;
color:white;
}

/* NAV */
nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 25px;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(10px);
position:sticky;
top:0;
z-index:10;
}

nav h2{color:#4fd1ff;}

/* LAYOUT */
section{
max-width:1100px;
margin:auto;
padding:40px 20px;
}

h1,h2{color:#4fd1ff;}

.card{
background:rgba(255,255,255,0.06);
padding:15px;
border-radius:12px;
border:1px solid rgba(255,255,255,0.1);
margin-top:10px;
}

/* 🗺️ DECORATIVE MAP */
.map{
height:500px;
border-radius:12px;
margin-top:15px;
position:relative;
overflow:hidden;
background: radial-gradient(circle at 30% 30%, #0b3d91, #020617);
}

/* glowing grid lines */
.map::before{
content:"";
position:absolute;
width:200%;
height:200%;
background:
linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
background-size:60px 60px;
animation:gridMove 10s linear infinite;
opacity:0.3;
}

@keyframes gridMove{
0%{transform:translate(0,0);}
100%{transform:translate(-60px,-60px);}
}

/* floating nodes */
.node{
width:10px;
height:10px;
background:#4fd1ff;
border-radius:50%;
position:absolute;
box-shadow:0 0 10px #4fd1ff;
animation:float 3s infinite ease-in-out;
}

@keyframes float{
50%{transform:scale(1.5); opacity:0.5;}
}

/* REPORT */
.report{
white-space:pre-line;
font-size:14px;
}

</style>

</head>

<body>

<nav>
<h2>EchoEarth GEO System</h2>
</nav>

<section>

<h1>🛰 Global Geo Intelligence System</h1>

<div class="card">
🧠 Click anywhere on the map (decorative system only)
</div>

<div class="map" id="map"></div>

<div class="card" id="output" style="display:none;"></div>

</section>

<script>

/* 🗺️ CREATE DECORATIVE NODES */
const map = document.getElementById("map");

for(let i=0;i<12;i++){
let node = document.createElement("div");
node.className="node";
node.style.top=Math.random()*90+"%";
node.style.left=Math.random()*90+"%";
node.style.animationDelay=Math.random()*3+"s";
map.appendChild(node);
}

/* 🧠 SIMPLE AI ANALYSIS ONLY (NO MAP DATA) */
map.addEventListener("click", function(){

let score = Math.floor(Math.random()*100);
let type = "Normal Zone";

if(score > 70) type = "High Activity Zone";
if(score > 85) type = "Critical Interest Zone";

let output = document.getElementById("output");
output.style.display="block";

output.innerHTML =
"<div class='report'>" +
"📊 EchoEarth Simulation Analysis\n" +
"-----------------------------\n" +
"📊 Score: " + score + "/100\n" +
"🧠 Classification: " + type + "\n" +
"🛰 Status: Completed (Simulated System)" +
"</div>";

});

</script>

</body>
</html>
