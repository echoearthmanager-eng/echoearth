<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EchoEarth</title>

<style>
body{margin:0;font-family:Arial;background:#f4f7f9;color:#333}
header{background:#0f172a;color:#fff;text-align:center;padding:80px}
section{max-width:1000px;margin:auto;padding:40px}
.service{background:#fff;margin:15px 0;padding:20px;border-radius:10px}
.contact{background:#fff;padding:20px;border-radius:10px}
input,textarea{width:100%;padding:10px;margin:10px 0}
button{background:#0f172a;color:#fff;padding:10px 20px;border:0}
</style>

</head>

<body>

<header>
<h1>EchoEarth</h1>
<p>Advanced Earth Intelligence Platform</p>
</header>

<section>
<h2>About</h2>
<p>EchoEarth is a platform for Earth observation and geological analysis.</p>
</section>

<section>
<h2>Services</h2>

<div class="service">Geological Analysis</div>
<div class="service">Earth Observation</div>
<div class="service">Exploration Support</div>

</section>

<section class="contact">

<h2>Contact</h2>

<form action="https://formsubmit.co/echoearthmanager@gmail.com" method="POST">
<input type="text" name="name" placeholder="Name" required>
<input type="email" name="email" placeholder="Email" required>
<input type="text" name="subject" placeholder="Subject" required>
<textarea name="message" placeholder="Message" required></textarea>
<button type="submit">Send</button>
</form>

</section>

</body>
</html>
