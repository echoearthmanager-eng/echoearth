<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EchoEarth Geo Intelligence System</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#050814;
color:white;
}

nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 25px;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(10px);
position:sticky;
top:0;
z-index:10;
}

nav h2{color:#4fd1ff;}

section{
max-width:1100px;
margin:auto;
padding:40px 20px;
}

h1,h2{color:#4fd1ff;}

.card{
background:rgba(255,255,255,0.06);
padding:15px;
border-radius:12px;
border:1px solid rgba(255,255,255,0.1);
margin-top:10px;
}

input,textarea{
width:100%;
padding:12px;
margin:8px 0;
border:none;
border-radius:8px;
}

button{
background:#4fd1ff;
color:black;
padding:12px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
width:100%;
}

#map{
height:450px;
border-radius:12px;
margin-top:15px;
}

.report{
white-space:pre-line;
font-size:14px;
}

</style>

</head>

<body>

<nav>
<h2>EchoEarth GEO System</h2>
</nav>

<section>

<h1>🛰 Global Geo Intelligence System</h1>

<div class="card">

<p>Enter coordinates:</p>

<input id="lat" placeholder="Latitude (e.g. 32.1234)">
<input id="lon" placeholder="Longitude (e.g. 20.4567)">

<button onclick="analyze()">Analyze & Mark on Map</button>

</div>

<div id="map"></div>

<div class="card" id="output" style="display:none;"></div>

</section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

let map = L.map('map').setView([26, 18], 5);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
maxZoom: 18,
}).addTo(map);

function analyze(){

let lat = parseFloat(document.getElementById("lat").value);
let lon = parseFloat(document.getElementById("lon").value);

if(isNaN(lat) || isNaN(lon)){
alert("Enter valid coordinates");
return;
}

// random intelligence simulation
let score = Math.floor(Math.random()*100);
let type = "Normal Zone";

if(score>70) type="High Geological Activity Zone";
if(score>85) type="Critical Interest Zone";

L.marker([lat, lon]).addTo(map)
.bindPopup("EchoEarth Analysis<br>Score: "+score+"<br>"+type)
.openPopup();

map.setView([lat, lon], 8);

let output=document.getElementById("output");
output.style.display="block";

output.innerHTML=
"<div class='report'>"+
"📍 Coordinates: "+lat+", "+lon+"\n"+
"📊 Score: "+score+"/100\n"+
"🧠 Classification: "+type+"\n"+
"🛰 Status: Analysis Complete"+
"</div>";

}

</script>

</body>
</html>
