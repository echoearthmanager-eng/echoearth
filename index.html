<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EchoEarth</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#000;
color:white;
overflow-x:hidden;
}

/* 🌌 SPACE */
.space{
position:fixed;
width:100%;
height:100%;
top:0;
left:0;
z-index:-3;
background: radial-gradient(circle at top, #0b1220, #000);
overflow:hidden;
}

/* ⭐ STARS */
.star{
position:absolute;
width:2px;
height:2px;
background:white;
border-radius:50%;
opacity:0.6;
animation:twinkle 3s infinite;
}

@keyframes twinkle{
50%{opacity:0.1;}
}

/* 🌍 EARTH */
.earth{
position:absolute;
top:20px;
left:50%;
transform:translateX(-50%);
width:160px;
height:160px;
border-radius:50%;
background: radial-gradient(circle at 30% 30%, #2de2ff, #0b3d91, #000);
box-shadow:0 0 60px #2de2ff;
}

/* 🛰 SATELLITE */
.orbit{
position:absolute;
top:20px;
left:50%;
width:220px;
height:220px;
transform:translateX(-50%);
animation:rotate 12s linear infinite;
}

.satellite{
position:absolute;
top:0;
left:50%;
width:14px;
height:14px;
background:#ccc;
border-radius:3px;
box-shadow:0 0 10px white;
}

@keyframes rotate{
100%{transform:translateX(-50%) rotate(360deg);}
}

/* NAV */
nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 40px;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(10px);
position:sticky;
top:0;
}

nav h2{color:#4fd1ff;}

/* HERO */
.hero{
text-align:center;
padding-top:220px;
padding-bottom:40px;
}

/* 🧠 LOGO */
.logo{
width:200px;
margin:0 auto;
display:flex;
flex-direction:column;
align-items:center;
gap:12px;
}

/* 🔷 PENROSE 3D ILLUSION */
.penrose{
width:80px;
height:80px;
position:relative;
transform:rotate(45deg);
animation:float 4s ease-in-out infinite, glow 3s ease-in-out infinite;
transition:0.4s;
cursor:pointer;
}

.penrose:hover{
transform:rotate(45deg) scale(1.15);
filter:drop-shadow(0 0 15px #ffffff);
}

.penrose::before,
.penrose::after{
content:"";
position:absolute;
inset:0;
border:3px solid #dcdcdc;
border-top-color:#ffffff;
border-left-color:#ffffff;
border-right-color:#888;
border-bottom-color:#888;
border-radius:4px;
}

.penrose::after{
inset:12px;
opacity:0.7;
}

/* ✨ floating animation */
@keyframes float{
0%{transform:translateY(0) rotate(45deg);}
50%{transform:translateY(-8px) rotate(45deg);}
100%{transform:translateY(0) rotate(45deg);}
}

/* 💡 glow pulse */
@keyframes glow{
0%{box-shadow:0 0 5px #aaa;}
50%{box-shadow:0 0 20px #fff;}
100%{box-shadow:0 0 5px #aaa;}
}

/* 🧾 TEXT LOGO */
.logo-text{
font-size:18px;
letter-spacing:6px;
font-weight:bold;
color:#e6e6e6;
animation:fadeText 3s ease-in-out infinite;
}

@keyframes fadeText{
0%{opacity:0.7;}
50%{opacity:1;}
100%{opacity:0.7;}
}

/* SECTIONS */
section{
max-width:900px;
margin:auto;
padding:40px 20px;
}

.card{
background:rgba(255,255,255,0.06);
padding:20px;
margin:15px 0;
border-radius:12px;
border:1px solid rgba(255,255,255,0.1);
}

/* AI */
.ai-box{
background:rgba(0,255,200,0.08);
border:1px solid #00ffd5;
padding:15px;
border-radius:12px;
}

input{
width:100%;
padding:12px;
margin-top:10px;
border-radius:8px;
border:none;
}

button{
background:#4fd1ff;
color:black;
padding:12px;
border:none;
border-radius:8px;
cursor:pointer;
margin-top:10px;
font-weight:bold;
}

.response{
margin-top:10px;
opacity:0.9;
}

</style>

</head>

<body>

<!-- 🌌 SPACE -->
<div class="space">

<div class="earth"></div>

<div class="orbit">
<div class="satellite"></div>
</div>

</div>

<nav>
<h2>EchoEarth</h2>
</nav>

<div class="hero">

<div class="logo">

<!-- 🔷 ANIMATED LOGO -->
<div class="penrose"></div>

<div class="logo-text">ECHOEARTH</div>

</div>

<p>Advanced Earth Intelligence Platform</p>

</div>

<section>
<div class="card">
EchoEarth is a global Earth intelligence platform designed for exploration and data visualization.
</div>
</section>

</body>
</html>
